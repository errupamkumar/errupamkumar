.b{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.shine{animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,70%{transform:translateX(-140px)}100%{transform:translateX(140px)}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fd{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 3s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sweep{animation:sweep 4s linear infinite}
@keyframes sweep{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
</style>
