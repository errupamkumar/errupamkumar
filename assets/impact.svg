<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="Impact: 4.2 years experience, 20+ certifications, 80% less manual Excel work, 15 to 2 FTE">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F2C811"/><stop offset="1" stop-color="#FF9F1C"/></linearGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="n" x1="0" x2="1"><stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#4ADE80"/></linearGradient>
    <linearGradient id="p" x1="0" x2="1"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .card{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .a1{animation-delay:.1s}.a2{animation-delay:.3s}.a3{animation-delay:.5s}.a4{animation-delay:.7s}
    .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:fill 1.6s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes fill{to{transform:scaleX(1)}}
    .a1 .bar{animation-delay:.6s}.a2 .bar{animation-delay:.8s}.a3 .bar{animation-delay:1s}.a4 .bar{animation-delay:1.2s}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes glow{0%,100%{stroke-opacity:.15}50%{stroke-opacity:.6}}
    .a2 .glow{animation-delay:.75s}.a3 .glow{animation-delay:1.5s}.a4 .glow{animation-delay:2.25s}
  </style>

  <g class="card a1">
    <rect x="6" y="10" width="282" height="160" rx="16" fill="#0F1623"/>
    <rect class="glow" x="6" y="10" width="282" height="160" rx="16" fill="none" stroke="#F2C811" stroke-width="1.5"/>
    <text x="30" y="48" font-size="12" fill="#9CA3AF" font-weight="600" letter-spacing="1.4">EXPERIENCE</text>
    <text x="30" y="100" font-size="46" font-weight="800" fill="url(#g)">4.2 yrs</text>
    <text x="30" y="128" font-size="13" fill="#D1D5DB">Power BI · SQL · Data Analytics</text>
    <rect x="30" y="146" width="234" height="6" rx="3" fill="#1F2937"/>
    <rect class="bar" x="30" y="146" width="190" height="6" rx="3" fill="url(#g)"/>
  </g>

  <g class="card a2">
    <rect x="310" y="10" width="282" height="160" rx="16" fill="#0F1623"/>
    <rect class="glow" x="310" y="10" width="282" height="160" rx="16" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="334" y="48" font-size="12" fill="#9CA3AF" font-weight="600" letter-spacing="1.4">CERTIFIED</text>
    <text x="334" y="100" font-size="46" font-weight="800" fill="url(#t)">20+</text>
    <text x="334" y="128" font-size="13" fill="#D1D5DB">Claude · Microsoft · AWS · Google</text>
    <rect x="334" y="146" width="234" height="6" rx="3" fill="#1F2937"/>
    <rect class="bar" x="334" y="146" width="234" height="6" rx="3" fill="url(#t)"/>
  </g>

  <g class="card a3">
    <rect x="614" y="10" width="282" height="160" rx="16" fill="#0F1623"/>
    <rect class="glow" x="614" y="10" width="282" height="160" rx="16" fill="none" stroke="#4ADE80" stroke-width="1.5"/>
    <text x="638" y="48" font-size="12" fill="#9CA3AF" font-weight="600" letter-spacing="1.4">AUTOMATION</text>
    <text x="638" y="100" font-size="46" font-weight="800" fill="url(#n)">-80%</text>
    <text x="638" y="128" font-size="13" fill="#D1D5DB">Less manual Excel work</text>
    <rect x="638" y="146" width="234" height="6" rx="3" fill="#1F2937"/>
    <rect class="bar" x="638" y="146" width="187" height="6" rx="3" fill="url(#n)"/>
  </g>

  <g class="card a4">
    <rect x="918" y="10" width="276" height="160" rx="16" fill="#0F1623"/>
    <rect class="glow" x="918" y="10" width="276" height="160" rx="16" fill="none" stroke="#E879F9" stroke-width="1.5"/>
    <text x="942" y="48" font-size="12" fill="#9CA3AF" font-weight="600" letter-spacing="1.4">EFFICIENCY</text>
    <text x="942" y="100" font-size="46" font-weight="800" fill="url(#p)">15 → 2</text>
    <text x="942" y="128" font-size="13" fill="#D1D5DB">FTE needed for fraud reporting</text>
    <rect x="942" y="146" width="228" height="6" rx="3" fill="#1F2937"/>
    <rect class="bar" x="942" y="146" width="198" height="6" rx="3" fill="url(#p)"/>
  </g>
</svg>
