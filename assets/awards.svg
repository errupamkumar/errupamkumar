<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="HCLTech awards: Supercharge Progress Award (Excellence Award, FY 2025-26) and Excelencia Premio (FY 2023-24)">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset=".5" stop-color="#F2C811"/><stop offset="1" stop-color="#C98A00"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="glowG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F2C811" stop-opacity=".35"/><stop offset="1" stop-color="#F2C811" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#38BDF8" stop-opacity=".3"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <g id="trophy">
      <path d="M-26 -40 H26 V-12 C26 8 14 20 0 22 C-14 20 -26 8 -26 -12Z"/>
      <path d="M-26 -34 C-44 -34 -46 -10 -24 -4" fill="none" stroke-width="6"/>
      <path d="M26 -34 C44 -34 46 -10 24 -4" fill="none" stroke-width="6"/>
      <rect x="-6" y="20" width="12" height="14"/>
      <rect x="-20" y="34" width="40" height="9" rx="3"/>
    </g>
    <clipPath id="c1"><rect x="10" y="10" width="580" height="240" rx="20"/></clipPath>
    <clipPath id="c2"><rect x="610" y="10" width="580" height="240" rx="20"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .card{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
    .c2{animation-delay:.25s}
    @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .bob{animation:bob 3.6s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .glow{transform-box:fill-box;transform-origin:center;animation:glow 3s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
    .rays{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .shine{animation:shine 5s ease-in-out infinite}
    .s2{animation-delay:2.5s}
    @keyframes shine{0%,65%{transform:translateX(-200px)}100%{transform:translateX(700px)}}
    .tw{animation:tw 2.2s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  </style>

  <!-- Card 1: Supercharge Progress Award -->
  <g class="card">
    <rect x="10" y="10" width="580" height="240" rx="20" fill="#0F1623"/>
    <rect x="10" y="10" width="580" height="240" rx="20" fill="none" stroke="url(#gold)" stroke-opacity=".7" stroke-width="1.5"/>
    <g clip-path="url(#c1)">
      <circle class="glow" cx="120" cy="130" r="95" fill="url(#glowG)"/>
      <g class="rays" opacity=".18" stroke="#F2C811" stroke-width="2">
        <line x1="120" y1="40" x2="120" y2="220"/><line x1="30" y1="130" x2="210" y2="130"/>
        <line x1="56" y1="66" x2="184" y2="194"/><line x1="184" y1="66" x2="56" y2="194"/>
      </g>
      <rect class="shine" x="0" y="10" width="70" height="240" fill="url(#sh)" opacity=".07"/>
    </g>
    <g transform="translate(120 128)"><g class="bob"><use href="#trophy" fill="url(#gold)" stroke="#F2C811"/><path d="M0 -30 L4 -21 L14 -20 L6 -14 L9 -4 L0 -9 L-9 -4 L-6 -14 L-14 -20 L-4 -21Z" fill="#7A5200"/></g></g>
    <circle class="tw" cx="60" cy="60" r="2" fill="#FFE27A"/><circle class="tw" cx="190" cy="80" r="2.5" fill="#FFE27A" style="animation-delay:.8s"/><circle class="tw" cx="70" cy="200" r="2" fill="#FFE27A" style="animation-delay:1.4s"/>
    <text x="232" y="56" font-size="12" font-weight="700" fill="#F2C811" letter-spacing="1.6">HCLTECH · EXCELLENCE AWARD</text>
    <text x="232" y="96" font-size="27" font-weight="800" fill="#F3F4F6">Supercharge Progress</text>
    <text x="232" y="128" font-size="27" font-weight="800" fill="#F3F4F6">Award</text>
    <text x="232" y="160" font-size="14" fill="#9CA3AF">For performance excellence and extraordinary</text>
    <text x="232" y="180" font-size="14" fill="#9CA3AF">contribution to the organization</text>
    <rect x="232" y="198" width="104" height="28" rx="14" fill="#F2C811" fill-opacity=".14" stroke="#F2C811" stroke-opacity=".5"/>
    <text x="284" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#F2C811">FY 2025–26</text>
    <text x="350" y="217" font-size="12.5" fill="#6B7280">Sep 2025</text>
  </g>

  <!-- Card 2: Excelencia Premio -->
  <g class="card c2">
    <rect x="610" y="10" width="580" height="240" rx="20" fill="#0F1623"/>
    <rect x="610" y="10" width="580" height="240" rx="20" fill="none" stroke="url(#sky)" stroke-opacity=".7" stroke-width="1.5"/>
    <g clip-path="url(#c2)">
      <circle class="glow" cx="720" cy="130" r="95" fill="url(#glowB)" style="animation-delay:1.5s"/>
      <g class="rays" opacity=".18" stroke="#38BDF8" stroke-width="2">
        <line x1="720" y1="40" x2="720" y2="220"/><line x1="630" y1="130" x2="810" y2="130"/>
        <line x1="656" y1="66" x2="784" y2="194"/><line x1="784" y1="66" x2="656" y2="194"/>
      </g>
      <rect class="shine s2" x="600" y="10" width="70" height="240" fill="url(#sh)" opacity=".07"/>
    </g>
    <g transform="translate(720 128)"><g class="bob" style="animation-delay:1.2s">
      <circle r="44" fill="url(#sky)"/><circle r="36" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 5"/>
      <path d="M0 -22 L6.5 -7 L23 -6 L10.5 4.5 L14.5 21 L0 12 L-14.5 21 L-10.5 4.5 L-23 -6 L-6.5 -7Z" fill="#fff"/>
      <path d="M-30 36 L-40 64 L-26 58 L-20 70 L-12 42Z" fill="#1D4ED8"/><path d="M30 36 L40 64 L26 58 L20 70 L12 42Z" fill="#1D4ED8"/>
    </g></g>
    <circle class="tw" cx="660" cy="62" r="2" fill="#BAE6FD" style="animation-delay:.4s"/><circle class="tw" cx="790" cy="76" r="2.5" fill="#BAE6FD" style="animation-delay:1.2s"/><circle class="tw" cx="668" cy="206" r="2" fill="#BAE6FD" style="animation-delay:1.8s"/>
    <text x="832" y="56" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1.6">HCLTECH · REWARDS &amp; RECOGNITION</text>
    <text x="832" y="96" font-size="27" font-weight="800" fill="#F3F4F6">Excelencia Premio</text>
    <text x="832" y="124" font-size="14" font-style="italic" fill="#7DD3FC">Engage · Enable · Empower</text>
    <text x="832" y="160" font-size="14" fill="#9CA3AF">For exemplary performance and</text>
    <text x="832" y="180" font-size="14" fill="#9CA3AF">demonstration of values</text>
    <rect x="832" y="198" width="104" height="28" rx="14" fill="#38BDF8" fill-opacity=".14" stroke="#38BDF8" stroke-opacity=".5"/>
    <text x="884" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#38BDF8">FY 2023–24</text>
    <text x="950" y="217" font-size="12.5" fill="#6B7280">Jan 2024</text>
  </g>
</svg>
